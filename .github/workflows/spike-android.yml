name: spike-android

# Android text spike: taffy in Rust measuring 1000 text leaves through JNI into a Kotlin
# StaticLayout engine, against the same tree in Jetpack Compose and in Parley; the text-parity run
# (spikes/text-parity) of option A (StaticLayout), B (Parley drawn by vello) and C (Parley's glyph
# runs drawn by Canvas), compared on the host; and the advance-rule sweep: which rule Minikin's
# hinted advances follow, and A against B and C with Parley's advances set by it, at four
# densities.

on:
  push:
    branches: [claude/platform-architecture-tradeoffs-y9q57l]
    paths:
      - spikes/android/**
      - spikes/text-parity/**
      - .github/workflows/spike-android.yml
  workflow_dispatch:
    inputs:
      suite:
        description: "full (everything) or sweep (the advance-rule sweep alone)"
        required: false
        default: full

concurrency:
  group: spike-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The NDK the Rust libraries are built with and the app's build strips them with (its
# `ndkVersion`), installed where the runner image lacks it.
env:
  NDK_VERSION: 30.0.16248370

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: spikes/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
          cache-provider: basic

      - name: The pinned NDK
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          [ -d "$NDK" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          cat "$NDK/source.properties"

      # The repository's rust-toolchain.toml pins the toolchain; add the targets to that one.
      - name: Rust targets for the emulator's ABI and for phones
        working-directory: spikes/android/rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-linux-android aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Tool versions
        run: |
          cargo ndk --version
          java -version 2>&1 | head -1
          gradle --version | grep -E "^(Gradle|Kotlin|JVM)"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spikes/android/rust
            spikes/android/plain

      - name: Build the Rust library
        working-directory: spikes/android/rust
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t x86_64 --platform 29 -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/x86_64

      # Parley as an app ships it, weighed with and without its complex-script dictionaries; the
      # build without them goes into the APK for the line-break probe.
      - name: Weigh Parley and build the plain library
        working-directory: spikes/android/plain
        run: |
          mkdir -p ../../../sizes
          for target in x86_64 arm64-v8a; do
            triple=$([ "$target" = x86_64 ] && echo x86_64-linux-android || echo aarch64-linux-android)
            for features in none parley complex; do
              flag=$([ "$features" = none ] && echo "" || echo "--features $features")
              cargo ndk -t "$target" --platform 29 build --release $flag
              size=$(stat -c %s "target/$triple/release/libskene_plain_parley.so")
              echo "plain.$target.$features.bytes=$size" | tee -a ../../../sizes/sizes.txt
              if [ "$target" = x86_64 ] && [ "$features" = parley ]; then
                cp "target/$triple/release/libskene_plain_parley.so" ../app/src/main/jniLibs/x86_64/
              fi
            done
          done
          echo "spike.x86_64.bytes=$(stat -c %s ../app/src/main/jniLibs/x86_64/libskene_text_spike.so)" | tee -a ../../../sizes/sizes.txt

      - name: Build the app and test APKs
        run: gradle --no-daemon assembleRelease assembleReleaseAndroidTest

      - name: Collect APKs
        run: |
          mkdir -p ../../apks
          cp app/build/outputs/apk/release/app-release.apk ../../apks/
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk ../../apks/
          ls -la ../../apks

      - uses: actions/upload-artifact@v7
        with:
          name: spike-android-apks
          path: apks
          retention-days: 5

      - uses: actions/upload-artifact@v7
        with:
          name: spike-android-sizes
          path: sizes
          retention-days: 5

  emulator:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # `image` names the system image where its level is not `api` alone: API 37's newest
      # x86_64 image with 4 KB pages is 37.0's, Google APIs only.
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: default
          - api: 35
            target: google_apis
          - api: 36
            target: default
          - api: 37
            image: "37.0"
            target: google_apis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: spike-android-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.image || matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash spikes/android/run-on-emulator.sh apks results-api${{ matrix.api }}.txt parity-api${{ matrix.api }} ${{ github.event.inputs.suite || 'full' }}

      - name: Results
        if: always()
        run: |
          python3 spikes/android/summarize.py results-api${{ matrix.api }}.txt > summary-api${{ matrix.api }}.txt || true
          echo "=== RESULTS === (API ${{ matrix.api }})"
          cat summary-api${{ matrix.api }}.txt
          echo "--- raw ---"
          cat results-api${{ matrix.api }}.txt || true
          echo "=== END ==="

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-android-results-api${{ matrix.api }}
          path: |
            results-api${{ matrix.api }}*
            summary-api${{ matrix.api }}*
            parity-api${{ matrix.api }}

  compare:
    needs: emulator
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: spike-android-results-api*
          path: results

      - uses: actions/download-artifact@v8
        with:
          name: spike-android-sizes
          path: sizes

      - name: fontconfig for the harness's Linux build
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/text-parity

      - name: Build the text-parity harness
        working-directory: spikes/text-parity
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release

      - name: Compare
        run: |
          mkdir -p parity
          for api in 29 34 35 36 37; do
            src=results/spike-android-results-api$api
            mkdir -p parity/api$api
            cp "$src"/results-api$api.txt parity/api$api/ || true
            if [ -d "$src/parity-api$api" ]; then
              cp -r "$src/parity-api$api" parity/api$api/parity
              echo "=== COMPARE API $api ==="
              bash spikes/android/compare.sh spikes/text-parity/target/release/text-parity parity/api$api/parity
            fi
          done
          python3 spikes/android/parity.py parity sizes/sizes.txt > /dev/null || echo "parity.py failed"
          python3 spikes/android/sweep.py parity
          echo "=== SUMMARY ==="
          cat parity/summary.md
          echo "=== SWEEP ==="
          cat parity/sweep.md
          echo "=== END ==="

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-android-parity
          path: parity
          retention-days: 7
