name: spike-apple

on:
  push:
    branches: [claude/platform-architecture-tradeoffs-y9q57l]
    paths:
      - spikes/apple/**
      - spikes/text-parity/**
      - .github/workflows/spike-apple.yml
  workflow_dispatch:
    inputs:
      parts:
        description: "Suite parts (corpus,probes,subsets,smoothing,genmoji; none for the font memory probe alone); empty runs all"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: spike-apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            spikes/apple
            spikes/text-parity

      - name: Install the pinned Rust toolchain
        working-directory: spikes/apple/parity
        run: |
          rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/apple/parity
          key: ios-sim

      - name: Build the Rust half for the simulator
        working-directory: spikes/apple/parity
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          cargo build --release --lib --bin parity-probe --target aarch64-apple-ios-sim
          ls -la target/aarch64-apple-ios-sim/release/ | grep -E "libapple_parity|parity-probe"

      - name: Pick an iOS 17+ simulator
        id: sim
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          best = None
          for runtime, entries in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-")[1].split("-"))
              if version < (17,):
                  continue
              for device in entries:
                  if device["name"].startswith("iPhone") and "SE" not in device["name"] and device.get("isAvailable", True):
                      key = (version, device["name"])
                      if best is None or key > best[0]:
                          best = (key, device["udid"], runtime, device["name"])
          print(f"Picked {best[3]} on {best[2]}", file=sys.stderr)
          print(f"udid={best[1]}")
          print(f"name={best[3]} ({best[2].split('.')[-1]})")
          EOF

      - name: Test on the simulator
        working-directory: spikes/apple/ios
        env:
          TEST_RUNNER_SPIKE_OUT: ${{ runner.temp }}/out
          TEST_RUNNER_PARITY_PARTS: ${{ github.event.inputs.parts }}
        run: |
          mkdir -p "$TEST_RUNNER_SPIKE_OUT"
          UDID="${{ steps.sim.outputs.udid }}"
          xcodebuild -list -json | tee "$RUNNER_TEMP/list.json"
          SCHEME=$(python3 -c 'import json,sys; s=json.load(open(sys.argv[1]))["workspace"]["schemes"]; print("TextSpike-Package" if "TextSpike-Package" in s else "TextSpike")' "$RUNNER_TEMP/list.json")
          xcrun simctl boot "$UDID" || true
          status=0
          xcodebuild build-for-testing -scheme "$SCHEME" -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" SWIFT_OPTIMIZATION_LEVEL=-O CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          xcrun simctl bootstatus "$UDID" -b || true
          if [ "$status" = 0 ]; then
            xcodebuild test-without-building -scheme "$SCHEME" -destination "id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/dd" -only-testing:TextSpikeTests/ParityTests/testParitySuite \
              >> "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
            for language in en th ar hi; do
              xcodebuild test-without-building -scheme "$SCHEME" -destination "id=$UDID" \
                -derivedDataPath "$RUNNER_TEMP/dd" -only-testing:TextSpikeTests/ParityTests/testLanguageLineHeight \
                -testLanguage "$language" >> "$RUNNER_TEMP/xcodebuild-language.log" 2>&1 || echo "language $language: exit $?"
            done
          fi
          {
            echo "=== spawned parity-probe (simctl spawn, -AppleLanguages) ==="
            PROBE="$GITHUB_WORKSPACE/spikes/apple/parity/target/aarch64-apple-ios-sim/release/parity-probe"
            for language in en th ar hi; do
              xcrun simctl spawn "$UDID" "$PROBE" language -AppleLanguages "($language)" 2>&1 | tail -3 || echo "spawn $language failed"
            done
          } | tee "$TEST_RUNNER_SPIKE_OUT/ios-spawn-language.txt"
          grep -E "error:|Undefined symbols|ld:|Test Case .*(passed|failed)|\*\* TEST|Restarting after|crash|PANICKED" "$RUNNER_TEMP/xcodebuild.log" | head -200 || true
          {
            echo "=== RESULTS ==="
            echo "spike apple / ios on ${{ steps.sim.outputs.name }}, $(xcodebuild -version | head -1)"
            cat "$TEST_RUNNER_SPIKE_OUT/ios-parity.txt" 2>/dev/null || grep -E "^SPIKE\| " "$RUNNER_TEMP/xcodebuild.log" | sed 's/^SPIKE| //'
            for file in "$TEST_RUNNER_SPIKE_OUT"/ios-language-*.json; do [ -f "$file" ] && { echo "--- $(basename "$file")"; cat "$file"; }; done
            cat "$TEST_RUNNER_SPIKE_OUT/ios-spawn-language.txt"
            echo "xcodebuild exit status: $status"
            echo "=== END ==="
          } | tee "$TEST_RUNNER_SPIKE_OUT/results.txt"
          cp "$RUNNER_TEMP"/xcodebuild*.log "$TEST_RUNNER_SPIKE_OUT/"
          exit $status

      # The tuned engine's start-up and memory per way of storing its fonts, one fresh process
      # each (simctl spawn), and the XCTest a phone runs (font files opened and mapped, the probe
      # in the test process).
      - name: Font start-up and memory on the simulator
        if: always()
        working-directory: spikes/apple/ios
        env:
          TEST_RUNNER_SPIKE_OUT: ${{ runner.temp }}/out
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          UDID="${{ steps.sim.outputs.udid }}"
          PROBE="$GITHUB_WORKSPACE/spikes/apple/parity/target/aarch64-apple-ios-sim/release/parity-probe"
          for storage in copy layout map map-all; do
            started=$(python3 -c 'import time; print(time.time())')
            xcrun simctl spawn "$UDID" "$PROBE" fontmem "$storage" > "$OUT/fontmem-ios-$storage.json" 2> "$OUT/fontmem-ios-$storage.log" || echo "fontmem $storage: exit $?"
            python3 -c 'import sys, time; print("spawn wall ms %.1f" % ((time.time() - float(sys.argv[1])) * 1e3))' "$started" >> "$OUT/fontmem-ios-$storage.log"
            tail -3 "$OUT/fontmem-ios-$storage.log"
          done
          xcrun simctl spawn "$UDID" "$PROBE" fonttables > "$OUT/fonttables-ios.json" || echo "fonttables: exit $?"
          xcodebuild -list -json > "$RUNNER_TEMP/list-fonts.json"
          SCHEME=$(python3 -c 'import json,sys; s=json.load(open(sys.argv[1]))["workspace"]["schemes"]; print("TextSpike-Package" if "TextSpike-Package" in s else "TextSpike")' "$RUNNER_TEMP/list-fonts.json")
          for test in testFontFiles testFontMemoryMapped testFontMemoryCopied; do
            xcodebuild test-without-building -scheme "$SCHEME" -destination "id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/dd" -only-testing:TextSpikeTests/FontAccessTests/$test \
              >> "$OUT/xcodebuild-fonts.log" 2>&1 || echo "$test: exit $?"
          done
          grep -E "SPIKE\| (FONTFILE|FONTMEM)" "$OUT/xcodebuild-fonts.log" | cut -c1-700 || true
          echo "=== FONTMEM ==="
          python3 ../fontmem.py "$OUT" ios | tee "$OUT/fontmem-ios.md"
          echo "=== END ==="

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-apple-ios
          path: ${{ runner.temp }}/out

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            spikes/apple
            spikes/text-parity

      - name: Install the pinned Rust toolchain
        working-directory: spikes/apple/parity
        run: |
          rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spikes/apple/macos
            spikes/apple/parity

      - name: TextKit 2 node spike (the first round)
        working-directory: spikes/apple/macos
        env:
          SPIKE_OUT: ${{ runner.temp }}/out/macos.txt
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          sw_vers
          cargo test --release --test spike 2>&1 | tail -60 | tee "$RUNNER_TEMP/out/cargo-node.log" || echo "node spike failed"

      - name: Parity suite
        working-directory: spikes/apple/parity
        run: |
          cargo build --release --bins
          set +e
          ./target/release/parity-probe suite "{\"out\": \"$RUNNER_TEMP/out/parity\", \"scales\": [1, 2], \"parts\": [$(echo '${{ github.event.inputs.parts }}' | sed 's/[^,][^,]*/"&"/g')]}" 2>&1 | tee "$RUNNER_TEMP/out/parity.log"
          echo "suite exit status: ${PIPESTATUS[0]}" | tee -a "$RUNNER_TEMP/out/parity.log"

      - name: Sandbox probe
        working-directory: spikes/apple/parity
        run: |
          set +e
          mkdir -p "$HOME/Library/Fonts"
          FONT="$HOME/Library/Fonts/SkeneProbe-AtkinsonHyperlegible.ttf"
          curl -fsSL -o "$FONT" https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible/AtkinsonHyperlegible-Regular.ttf \
            || cp /System/Library/Fonts/Supplemental/Arial.ttf "$FONT"
          sleep 3
          POSTSCRIPT=$(./target/release/sandbox-probe names "$FONT")
          echo "user font $FONT postscript $POSTSCRIPT"
          cat > "$RUNNER_TEMP/sandbox.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.app-sandbox</key><true/></dict></plist>
          EOF
          # A sandboxed executable needs a bundle identifier from an Info.plist, so the probe
          # runs from inside an app bundle, as an app's own binary does.
          APP="$RUNNER_TEMP/SandboxProbe.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/sandbox-probe "$APP/Contents/MacOS/sandbox-probe"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.skene.parity.sandbox</string>
          <key>CFBundleExecutable</key><string>sandbox-probe</string>
          <key>CFBundleName</key><string>SandboxProbe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>14.0</string>
          </dict></plist>
          EOF
          codesign --force --sign - --entitlements "$RUNNER_TEMP/sandbox.entitlements" "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | tail -5
          {
            echo "=== unsandboxed ==="
            ./target/release/sandbox-probe check "$POSTSCRIPT" "$FONT"
            echo "exit $?"
            echo "=== sandboxed (com.apple.security.app-sandbox) ==="
            "$APP/Contents/MacOS/sandbox-probe" check "$POSTSCRIPT" "$FONT"
            echo "exit $?"
            ls "$HOME/Library/Containers" 2>/dev/null | grep -i skene
            for report in "$HOME"/Library/Logs/DiagnosticReports/sandbox-probe*; do
              [ -f "$report" ] && head -c 4000 "$report"
            done
          } 2>&1 | tee "$RUNNER_TEMP/out/sandbox.txt"

      - name: Font start-up and memory
        if: always()
        working-directory: spikes/apple/parity
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          for storage in copy layout map map-all; do
            ./target/release/parity-probe fontmem "$storage" "$OUT/fontmem-macos-$storage.json" 2>&1 | tail -3 || echo "fontmem $storage failed"
          done
          ./target/release/parity-probe fonttables > "$OUT/fonttables-macos.json" || echo "fonttables failed"
          # Mapped under the App Sandbox, from an app bundle as a sandboxed app runs.
          APP="$RUNNER_TEMP/FontmemProbe.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/parity-probe "$APP/Contents/MacOS/parity-probe"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.skene.parity.fontmem</string>
          <key>CFBundleExecutable</key><string>parity-probe</string>
          <key>CFBundleName</key><string>FontmemProbe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>14.0</string>
          </dict></plist>
          EOF
          cat > "$RUNNER_TEMP/fontmem.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.app-sandbox</key><true/></dict></plist>
          EOF
          codesign --force --sign - --entitlements "$RUNNER_TEMP/fontmem.entitlements" "$APP"
          "$APP/Contents/MacOS/parity-probe" fontmem map-all > "$OUT/fontmem-macos-sandboxed.json" 2> "$OUT/fontmem-macos-sandboxed.log" || echo "sandboxed fontmem: exit $?"
          tail -2 "$OUT/fontmem-macos-sandboxed.log"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("sandboxed map-all fonts:", [(f["postscript"], f["how"], (f.get("access") or {}).get("open_errno"), (f.get("access") or {}).get("map_errno")) for f in d["fonts"]])' "$OUT/fontmem-macos-sandboxed.json" || true
          echo "=== FONTMEM ==="
          python3 ../fontmem.py "$OUT" macos | tee "$OUT/fontmem-macos.md"
          echo "=== END ==="

      - name: Results
        if: always()
        run: |
          {
            echo "=== RESULTS ==="
            echo "spike apple / macos on $(sw_vers -productVersion), $(cd spikes/apple/parity && rustc --version)"
            cat "$RUNNER_TEMP/out/parity/results.txt" 2>/dev/null || tail -100 "$RUNNER_TEMP/out/parity.log"
            echo "--- sandbox"
            cat "$RUNNER_TEMP/out/sandbox.txt" 2>/dev/null
            echo "--- node spike"
            cat "$RUNNER_TEMP/out/macos.txt" 2>/dev/null | head -40
            echo "=== END ==="
          } | tee "$RUNNER_TEMP/out/results.txt"
          test -f "$RUNNER_TEMP/out/parity/results.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-apple-macos
          path: ${{ runner.temp }}/out
