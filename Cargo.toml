[workspace]
resolver = "3"
members = ["examples/*", "packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
bon = "3.9"
rustc-hash = "2.1"
skene-core = { path = "packages/core", version = "0.1.0" }
skene-dom = { path = "packages/dom", version = "0.1.0" }
skene-reactive = { path = "packages/reactive", version = "0.1.0" }
skene-renderer = { path = "packages/renderer", version = "0.1.0" }
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
inline_always = "allow"
