[workspace]
resolver = "3"
members = ["examples/*/*", "packages/*", "xtask"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/skreborn/skene"

[workspace.dependencies]
accesskit = { default-features = false, version = "0.25" }
color = "0.3"
insta = { default-features = false, version = "1" }
js-sys = "0.3"
keyboard-types = { default-features = false, features = ["std", "webdriver"], version = "0.8" }
parley = { default-features = false, features = ["complex-scripts", "std"], version = "0.12" }
proc-macro-crate = "3"
proc-macro2 = "1"
proptest = { default-features = false, features = ["std"], version = "1" }
quote = "1"
rustc-hash = "2.1"
serde_json = "1"
skene-build = { path = "packages/build", version = "0.1.0" }
skene-conformance = { path = "packages/conformance", version = "0.1.0" }
skene-dev = { path = "packages/dev", version = "0.1.0" }
skene-foundation = { path = "packages/foundation", version = "0.1.0" }
skene-headless = { path = "packages/headless", version = "0.1.0" }
skene-layout = { path = "packages/layout", version = "0.1.0" }
skene-macros = { path = "packages/macros", version = "0.1.0" }
skene-reactive = { path = "packages/reactive", version = "0.1.0" }
skene-simple = { path = "packages/simple", version = "0.1.0" }
skene-simple-terminal = { path = "packages/simple-terminal", version = "0.1.0" }
skene-simple-web = { path = "packages/simple-web", version = "0.1.0" }
skene-terminal = { path = "packages/terminal", version = "0.1.0" }
skene-transport = { path = "packages/transport", version = "0.1.0" }
skene-web = { path = "packages/web", version = "0.1.0" }
smallvec = "1.15"
syn = { version = "3", features = ["full"] }
tracing = "0.1"
trybuild = "1"
ui-events = { default-features = false, features = ["std"], version = "0.3" }
unicode-segmentation = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"

[patch.crates-io]
parley = { path = "vendor/parley" }
parley_engine = { path = "vendor/parley_engine" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.cli]
inherits = "release"
codegen-units = 16
lto = "thin"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(skene_platform, values("server"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
inline_always = "allow"
min_ident_chars = "warn"
missing_const_for_fn = "warn"
too_long_first_doc_paragraph = "warn"
use_self = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "deny"
