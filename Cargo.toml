[workspace]
resolver = "3"
members = ["examples/*", "packages/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
color = "0.3"
fixed = "1.31"
rustc-hash = "2.1"
skene = { path = "packages/skene", version = "0.1.0" }
skene-core = { path = "packages/core", version = "0.1.0" }
skene-reactive = { path = "packages/reactive", version = "0.1.0" }
skene-web = { path = "packages/web", version = "0.1.0" }
strum = { version = "0.26", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
inline_always = "allow"
min_ident_chars = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
