[workspace]
resolver = "3"
members = ["examples/*/*", "packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
color = "0.3"
num-traits = "0.2"
proc-macro2 = "1"
quote = "1"
rustc-hash = "2.1"
skene-gui = { path = "packages/gui", version = "0.1.0" }
skene-core = { path = "packages/core", version = "0.1.0" }
skene-headless = { path = "packages/headless", version = "0.1.0" }
skene-macros = { path = "packages/macros", version = "0.1.0" }
skene-reactive = { path = "packages/reactive", version = "0.1.0" }
skene-record = { path = "packages/record", version = "0.1.0" }
skene-router = { path = "packages/router", version = "0.1.0" }
skene-runner = { path = "packages/runner", version = "0.1.0" }
skene-simple = { path = "packages/simple", version = "0.1.0" }
skene-tui = { path = "packages/tui", version = "0.1.0" }
skene-views = { path = "packages/views", version = "0.1.0" }
skene-web = { path = "packages/web", version = "0.1.0" }
smallvec = "1.15"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2", features = ["full"] }
tracing = "0.1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
inline_always = "allow"
min_ident_chars = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
