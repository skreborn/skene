[package]
name = "acme-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
skene-foundation.workspace = true
skene-gui.workspace = true

[target.'cfg(all(skene_platform = "web", not(skene_server)))'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
  "CanvasRenderingContext2d",
  "Element",
  "HtmlCanvasElement",
] }

[target.'cfg(all(skene_platform = "web", not(skene_server)))'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Window",
] }

[lints]
workspace = true
