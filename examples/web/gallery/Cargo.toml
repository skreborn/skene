[package]
name = "gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
acme-map = { path = "../../third-party/acme-map" }
skene-simple-web.workspace = true
skene-web = { features = ["gpu"], workspace = true }

[target.'cfg(all(skene_platform = "web", not(skene_server)))'.dev-dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
  "DomRect",
  "Document",
  "Element",
  "HtmlElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "Window",
] }

[lints]
workspace = true
