[package]
name = "skene-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The skene command: builds, dev servers with live reload, the terminal launcher and static generation"
license.workspace = true
repository.workspace = true

[[bin]]
name = "skene"
path = "src/main.rs"

[dependencies]
clap = { features = ["derive"], version = "4" }
serde = { features = ["derive"], version = "1" }
toml = "1"

# Host-only: the CLI is never itself a wasm build product; on wasm targets (a workspace
# build) it compiles to an empty stub.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cargo_metadata = "0.23"
notify = "8"
percent-encoding = "2"
skene-dev.workspace = true
skene-web.workspace = true
url = "2"
walkdir = "2"
wasm-bindgen-cli-support = "=0.2.126"
wasm-split-cli = "=0.8.0-alpha.1"

[target.'cfg(unix)'.dependencies]
rustix = { features = ["process", "termios"], version = "1" }

[lints]
workspace = true
