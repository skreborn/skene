[package]
name = "skene-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "skene"
path = "src/main.rs"

[dependencies]
clap = { features = ["derive"], version = "4" }
serde = { features = ["derive"], version = "1" }
serde_json = "1"
toml = "0.8"

# Host-only: the CLI is never itself a wasm build product; on wasm targets (a workspace
# build) it compiles to an empty stub.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "8"
percent-encoding = "2"
url = "2"
wasm-split-cli = "0.8.0-alpha.1"

[target.'cfg(unix)'.dependencies]
rustix = { features = ["process", "termios"], version = "1" }

[target.'cfg(windows)'.dependencies]
windows-sys = { features = ["Win32_System_Console"], version = "0.61" }

[lints]
workspace = true
