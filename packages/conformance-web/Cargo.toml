[package]
name = "skene-conformance-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The conformance suite in real browsers: its pages, written in the web's vocabulary, served as one web app, acted on over WebDriver by trusted input"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
skene-conformance.workspace = true
skene-web.workspace = true

# The server leaf's: the harness drives a browser from outside it, and in every other
# build its binary compiles to an empty stub.
[target.'cfg(all(skene_platform = "web", skene_server))'.dependencies]
base64 = "0.23"
png = "0.18"
serde_json.workspace = true
skene-foundation.workspace = true
ureq = { default-features = false, version = "3" }

[target.'cfg(all(skene_platform = "web", not(skene_server)))'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
