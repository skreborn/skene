[package]
name = "skene-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "skene's platform-agnostic foundation: the scene, dispatch, the style model, tokens, motion and every built-in view"
license.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
async-task = "4"
color.workspace = true
keyboard-types.workspace = true
libm = "0.2"
rustc-hash.workspace = true
serde = "1"
serde_json.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
thin-vec = "0.2"
ui-events.workspace = true
vello_cpu = { default-features = false, features = ["std", "u8_pipeline"], version = "0.2" }

[dev-dependencies]
skene-headless = { path = "../headless" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
