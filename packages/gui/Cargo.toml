[package]
name = "skene-gui"
version.workspace = true
edition.workspace = true

[dependencies]
serde = "1"
serde_json = "1"
skene-common.workspace = true
skene-core.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
skene-web.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
skene-headless.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
skene-simple.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
skene-headless.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "EventInit",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "ImageData",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "PointerEvent",
  "PointerEventInit",
  "Window",
] }

[lints]
workspace = true
