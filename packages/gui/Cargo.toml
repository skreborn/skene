[package]
name = "skene-gui"
version.workspace = true
edition.workspace = true

[features]
default = ["simple-views"]
# The ready-made Simple component library (`SimpleButton`, `SimpleCard`, …) over the
# raw controls.
simple-views = ["dep:skene-simple"]
# Serialize tagged signals to a byte snapshot and restore them on creation; see
# `skene-reactive`'s feature of the same name.
snapshot = ["skene-reactive/snapshot", "skene-web/snapshot"]
# Expose the driver teardown (`web::uninstall`) so one thread can run many independent
# mounts. Enabled automatically for this crate's own tests via the self dev-dependency.
test = ["skene-reactive/test", "skene-web/test"]

[dependencies]
rustc-hash.workspace = true
skene-core.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
skene-router.workspace = true
skene-simple = { optional = true, workspace = true }
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
skene-record.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = "1"
serde_json = "1"
skene-web.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
# Depend on ourselves with `test` on, so `cargo test` gets the driver teardown without a
# `--features` flag.
skene-gui = { path = ".", features = ["test"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "EventInit",
  "HtmlInputElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "Node",
  "NodeList",
  "PointerEvent",
  "PointerEventInit",
  "Window",
] }

[lints]
workspace = true
