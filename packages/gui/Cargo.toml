[package]
name = "skene-gui"
version.workspace = true
edition.workspace = true

[features]
# Expose the driver teardown (`web::uninstall`, `tui::uninstall`) so one thread can run
# many independent mounts. Enabled automatically for this crate's own tests via the self
# dev-dependency.
test = ["skene-reactive/test", "skene-tui?/test", "skene-web/test"]
# Select the terminal driver on native targets. On wasm the web driver stays selected by
# the target and this feature changes nothing.
tui = ["dep:skene-tui"]

[dependencies]
rustc-hash.workspace = true
skene-core.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
skene-router.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = "1"
serde_json = "1"
skene-web.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
skene-tui = { workspace = true, optional = true }

[dev-dependencies]
# Depend on ourselves with `test` on, so `cargo test` gets the driver teardown without a
# `--features` flag.
skene-gui = { path = ".", features = ["test"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "HtmlCollection",
  "HtmlElement",
  "Node",
  "NodeList",
  "Window",
] }

[lints]
workspace = true
