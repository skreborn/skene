[package]
name = "skene-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The host platform skene's web facade compiles against off its target, driven by tests"
license.workspace = true
repository.workspace = true

[dependencies]
fearless_simd = { default-features = false, features = ["force_support_fallback", "std"], version = "0.4" }
rustc-hash.workspace = true
skene-foundation.workspace = true
skene-layout.workspace = true
skene-reactive.workspace = true
skrifa = { default-features = false, features = ["std"], version = "0.44" }
unicode-segmentation = "1"
vello_cpu = { default-features = false, features = ["std", "u8_pipeline"], version = "0.2" }

[dev-dependencies]
png = "0.18"
skene-conformance = { path = "../conformance" }

[lints]
workspace = true
