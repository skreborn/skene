[package]
name = "skene-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The layout every skene platform but the web computes: the shared style model on taffy, generic over the platform's scalar"
license.workspace = true
repository.workspace = true

[dependencies]
parley = { default-features = false, features = ["std"], git = "https://github.com/linebender/parley", rev = "62790943af982ad3388a3ff96cef6f90ac80a8bb" }
rustc-hash.workspace = true
skene-foundation.workspace = true
skrifa = { default-features = false, features = ["std"], version = "0.44" }
taffy = "0.14"
unicode-segmentation = "1"

[lints]
workspace = true
