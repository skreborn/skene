[package]
name = "skene-simple-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Simple's presets of the built-in views of skene's web facade"
license.workspace = true
repository.workspace = true

[dependencies]
skene-foundation.workspace = true
skene-gui.workspace = true
skene-simple.workspace = true

[target.'cfg(all(skene_platform = "web", not(skene_server)))'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
  "css",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "HtmlCollection",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "PointerEvent",
  "PointerEventInit",
  "Window",
] }

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
# Each target names its leaf: the browser on wasm32, the server leaf on the host.
cargo-args = [
  "--config",
  'target.wasm32-unknown-unknown.rustflags = ["--cfg", "skene_platform=\"web\""]',
  "--config",
  'target.wasm32-unknown-unknown.rustdocflags = ["--cfg", "skene_platform=\"web\""]',
  "--config",
  'target.x86_64-unknown-linux-gnu.rustflags = ["--cfg", "skene_platform=\"web\"", "--cfg", "skene_server"]',
  "--config",
  'target.x86_64-unknown-linux-gnu.rustdocflags = ["--cfg", "skene_platform=\"web\"", "--cfg", "skene_server"]',
]

[lints]
workspace = true
