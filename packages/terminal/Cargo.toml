[package]
name = "skene-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Host-only: the terminal platform never itself compiles to wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
libc = "0.2"
memchr = "2"
miniz_oxide = "0.9"
rustc-hash.workspace = true
rustix = { default-features = false, features = ["event", "pty", "std", "stdio", "termios"], version = "1" }
skene-dev.workspace = true
skene-foundation.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
taffy = "0.9"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { default-features = false, features = ["cargo_bench_support"], version = "0.5" }
proptest.workspace = true
skene-conformance.workspace = true
skene-simple-terminal.workspace = true
vt100 = "0.16"

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
