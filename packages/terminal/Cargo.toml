[package]
name = "skene-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "skene's terminal facade and platform: views typed to the terminal, down to the device"
license.workspace = true
repository.workspace = true

# Host-only: the terminal platform never itself compiles to wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23"
libc = "0.2"
memchr = "2"
miniz_oxide = "0.9"
rustc-hash.workspace = true
rustix = { default-features = false, features = ["event", "pty", "std", "stdio", "termios"], version = "1" }
skene-dev.workspace = true
skene-foundation.workspace = true
skene-layout.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
tracing.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { default-features = false, features = ["cargo_bench_support"], version = "0.8" }
proptest.workspace = true
skene-conformance = { path = "../conformance" }
skene-simple-terminal = { path = "../simple-terminal" }
vt100 = "0.18"

[[bench]]
name = "frame"
harness = false

[build-dependencies]
unicode-width = "0.2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
