[package]
name = "skene-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP and WebSocket clients for skene apps, on the web and on every other host"
license.workspace = true
repository.workspace = true

[dependencies]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "BinaryType",
  "CloseEvent",
  "Event",
  "Headers",
  "MessageEvent",
  "Request",
  "RequestInit",
  "Response",
  "WebSocket",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { default-features = false, features = ["logging", "ring", "std", "tls12"], version = "0.23" }
rustls-platform-verifier = "0.7"
tungstenite = { features = ["rustls-tls-native-roots"], version = "0.30" }
ureq = { default-features = false, features = ["gzip", "platform-verifier", "rustls-no-provider"], version = "3" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]

[lints]
workspace = true
