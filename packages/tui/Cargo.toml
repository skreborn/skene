[package]
name = "skene-tui"
version.workspace = true
edition.workspace = true

# Host-only: the terminal driver never itself compiles to wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
postcard = { default-features = false, features = ["alloc"], version = "1" }
rustc-hash.workspace = true
rustix = { default-features = false, features = ["event", "std", "stdio", "termios"], version = "1" }
skene-core.workspace = true
skene-reactive.workspace = true
skene-router.workspace = true
skene-tui-core.workspace = true
skene-views.workspace = true
taffy = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
skene-simple-tui.workspace = true

[lints]
workspace = true
