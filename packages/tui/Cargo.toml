[package]
name = "skene-tui"
version.workspace = true
edition.workspace = true

# Host-only: the terminal driver never itself compiles to wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
postcard = { default-features = false, features = ["alloc"], version = "1" }
rustc-hash.workspace = true
skene-core.workspace = true
skene-reactive.workspace = true
skene-router.workspace = true
skene-tui-core.workspace = true
skene-views.workspace = true
taffy = "0.9"
# The fork carries the OSC 52 reply parse until the upstream PR merges.
termina = { branch = "parse-selection", git = "https://github.com/skreborn/termina" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
skene-simple-tui.workspace = true

[lints]
workspace = true
