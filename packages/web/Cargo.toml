[package]
name = "skene-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "skene's web facade and platform: views typed to the web, rendered in the browser and on the server"
license.workspace = true
repository.workspace = true

[dependencies]
rustc-hash.workspace = true
serde_json.workspace = true
sfv = "0.16"
skene-dev.workspace = true
skene-foundation.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
tracing.workspace = true

# The headless platform on every host the build compiles no web leaf for.
[target.'cfg(not(any(all(target_arch = "wasm32", target_os = "unknown"), skene_platform = "server")))'.dependencies]
skene-headless.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
async-task = "4"
console_error_panic_hook = "0.1"
js-sys.workspace = true
vello_gpu = { default-features = false, features = ["std", "wgpu"], optional = true, version = "0.3" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Clipboard",
  "Comment",
  "console",
  "css",
  "CssStyleDeclaration",
  "CssStyleSheet",
  "DataTransfer",
  "Document",
  "DomRect",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventInit",
  "EventTarget",
  "FocusEvent",
  "History",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlStyleElement",
  "HtmlTextAreaElement",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverOptions",
  "ResizeObserverSize",
  "Response",
  "Selection",
  "Storage",
  "StyleSheet",
  "WheelEvent",
  "Window",
] }
wgpu = { default-features = false, features = ["std", "webgpu", "wgsl"], optional = true, version = "30" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"

[target.'cfg(unix)'.dependencies]
rustix = { features = ["stdio"], version = "1" }

[dev-dependencies]
skene-simple-web = { path = "../simple-web" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
skene-headless = { path = "../headless" }
trybuild.workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys.workspace = true
skene-headless = { path = "../headless" }
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
  "CanvasRenderingContext2d",
  "css",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomRect",
  "DomTokenList",
  "DragEvent",
  "DragEventInit",
  "Element",
  "Event",
  "EventInit",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "ImageData",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "PointerEvent",
  "PointerEventInit",
  "WheelEvent",
  "WheelEventInit",
  "Window",
] }

[build-dependencies]
skene-build.workspace = true

[features]
# Paints a painted box on the GPU where the page has WebGPU, through vello's GPU
# renderer; without it every painted box paints on the CPU.
gpu = ["dep:vello_gpu", "dep:wgpu"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]

[lints]
workspace = true
