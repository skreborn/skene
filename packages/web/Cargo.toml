[package]
name = "skene-web"
version.workspace = true
edition.workspace = true

[dependencies]
console_error_panic_hook = "0.1"
rustc-hash.workspace = true
skene-core.workspace = true
skene-reactive.workspace = true
smallvec = "1"
strum.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
skene-core = { workspace = true, features = ["test"] }
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "Element",
  "CssStyleDeclaration",
  "CssStyleSheet",
  "StyleSheet",
  "DomTokenList",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlStyleElement",
  "Node",
  "Text",
  "Event",
  "EventTarget",
  "MouseEvent",
  "KeyboardEvent",
  "InputEvent",
]

[lints]
workspace = true
