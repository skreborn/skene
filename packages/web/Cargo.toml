[package]
name = "skene-web"
version.workspace = true
edition.workspace = true

[dependencies]
rustc-hash.workspace = true
skene-core.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "console",
  "CssStyleDeclaration",
  "CssStyleSheet",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCollection",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "History",
  "HtmlStyleElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Storage",
  "Node",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "Response",
  "Selection",
  "StyleSheet",
  "Comment",
  "MediaQueryList",
  "ResizeObserverEntry",
  "Window",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasi = "0.14"

[dev-dependencies]
skene-reactive.workspace = true
skene-simple.workspace = true
skene-views.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventInit",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "PointerEvent",
  "PointerEventInit",
  "Window",
] }

[lints]
workspace = true
