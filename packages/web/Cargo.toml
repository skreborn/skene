[package]
name = "skene-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rustc-hash.workspace = true
serde_json = "1"
skene-common.workspace = true
skene-core.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
tracing.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
async-task = "4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
unicode-segmentation = "1"
vello_hybrid = { default-features = false, features = ["std"], version = "0.2" }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Clipboard",
  "Comment",
  "console",
  "css",
  "CssStyleDeclaration",
  "CssStyleSheet",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlStyleElement",
  "HtmlTextAreaElement",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Response",
  "Selection",
  "Storage",
  "StyleSheet",
  "Window",
] }
wgpu = { default-features = false, features = ["std", "webgpu", "wgsl"], version = "29" }

[dev-dependencies]
skene-reactive.workspace = true
skene-simple.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
  "css",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventInit",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "PointerEvent",
  "PointerEventInit",
  "Window",
] }

[lints]
workspace = true
