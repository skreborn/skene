[package]
name = "skene-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rustc-hash.workspace = true
serde = "1"
serde_json = "1"
sfv = "0.15"
skene-common.workspace = true
skene-core.workspace = true
skene-dev.workspace = true
skene-macros.workspace = true
skene-reactive.workspace = true
smallvec.workspace = true
tracing.workspace = true

# The headless platform on every host the build compiles no web leaf for.
[target.'cfg(not(any(all(target_arch = "wasm32", target_os = "unknown"), skene_platform = "server")))'.dependencies]
skene-headless.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
async-task = "4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
unicode-segmentation = "1"
vello_hybrid = { default-features = false, features = ["std"], version = "0.2" }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "Clipboard",
  "Comment",
  "console",
  "css",
  "CssStyleDeclaration",
  "CssStyleSheet",
  "DataTransfer",
  "Document",
  "DomRect",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventInit",
  "EventTarget",
  "FocusEvent",
  "History",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlStyleElement",
  "HtmlTextAreaElement",
  "ImageData",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverOptions",
  "ResizeObserverSize",
  "Response",
  "Selection",
  "Storage",
  "StyleSheet",
  "WheelEvent",
  "Window",
] }
wgpu = { default-features = false, features = ["std", "webgpu", "wgsl"], version = "29" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"

[target.'cfg(unix)'.dependencies]
rustix = { features = ["stdio"], version = "1" }

[dev-dependencies]
skene-simple.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
skene-headless.workspace = true
trybuild.workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = "0.3"
skene-headless.workspace = true
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "css",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomRect",
  "DomTokenList",
  "DragEvent",
  "DragEventInit",
  "Element",
  "Event",
  "EventInit",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "ImageData",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "PointerEvent",
  "PointerEventInit",
  "WheelEvent",
  "WheelEventInit",
  "Window",
] }

[build-dependencies]
skene-build.workspace = true

[lints]
workspace = true
