[package]
name = "skene-web"
version.workspace = true
edition.workspace = true

[features]
# Expose the platform teardown (`uninstall`) so one thread can run many independent
# mounts, as a test suite does.
test = ["skene-reactive/test"]

[dependencies]
rustc-hash.workspace = true
skene-core.workspace = true
skene-reactive.workspace = true
smallvec = "1"
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "console",
  "CssStyleDeclaration",
  "CssStyleSheet",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "History",
  "HtmlStyleElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Node",
  "NodeList",
  "PointerEvent",
  "StyleSheet",
  "Window",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasi = "0.14"

[lints]
workspace = true
