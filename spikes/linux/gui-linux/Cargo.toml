[package]
name = "skene-gui-linux"
description = "skene-gui's Linux realization, drawn by Skene: the scene laid out by the foundation's engine and painted with vello_cpu and Parley into a window it owns, on Wayland (smithay-client-toolkit) or X11 (x11rb), with the keyboard through xkbcommon, the reader's settings from the XDG settings portal, and the testing driver reading through AT-SPI and acting through real input (XTest, EIS, virtual devices, KWin's fake input)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
accesskit = "=0.25.1"
accesskit_unix = { default-features = false, features = ["async-io"], version = "=0.24.0" }
libc = "=0.2.190"
png = "=0.18.1"
pollster = { optional = true, version = "=0.4.0" }
raw-window-handle = { optional = true, version = "=0.6.2" }
reis = "=0.7.1"
serde = "=1.0.229"
sctk = { default-features = false, package = "smithay-client-toolkit", version = "=0.21.1" }
skene-foundation.workspace = true
skene-parley.workspace = true
unicode-segmentation.workspace = true
vello_common = { default-features = false, features = ["std"], optional = true, version = "=0.2.0" }
vello_cpu.workspace = true
vello_hybrid = { default-features = false, features = ["std", "wgpu"], optional = true, version = "=0.2.0" }
wayland-backend = { features = ["client_system", "dlopen"], optional = true, version = "=0.3.17" }
wayland-client = "=0.31.15"
wayland-protocols-misc = { features = ["client"], version = "=0.3.12" }
wayland-protocols-wlr = { features = ["client"], version = "=0.3.12" }
wgpu = { default-features = false, features = ["std", "vulkan", "wgsl"], optional = true, version = "=29.0.4" }
x11rb = { default-features = false, features = ["allow-unsafe-code", "cursor", "dri3", "present", "shape", "shm", "xfixes", "xinput", "xkb", "xtest"], version = "=0.14.0" }
xim = { default-features = false, features = ["x11rb-client", "x11rb-xcb"], version = "=0.5.0" }
xkbcommon = { default-features = false, features = ["wayland", "x11"], version = "=0.9.0" }
zbus = { default-features = false, features = ["async-io", "blocking-api"], version = "=5.19.0" }

[features]
# Paints each window on the GPU where an adapter presents to it (vello's hybrid renderer over
# wgpu's Vulkan, through the platform's swapchain), the CPU path its floor. Off by default.
gpu = [
  "dep:pollster",
  "dep:raw-window-handle",
  "dep:vello_common",
  "dep:vello_hybrid",
  "dep:wayland-backend",
  "dep:wgpu",
]

[lints]
workspace = true
