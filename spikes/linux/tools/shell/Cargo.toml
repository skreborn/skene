[package]
name = "skene-shell-tools"
description = "What the drawn Linux realization's checks act and read with: real input on X11 and Wayland, a settings-portal stand-in, an XSETTINGS manager, a clipboard client."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
libc = "=0.2.190"
reis = "=0.7.1"
serde = "1"
serde_json = "1"
wayland-client = "=0.31.15"
wayland-protocols-misc = { features = ["client"], version = "0.3.12" }
wayland-protocols-plasma = { features = ["client"], version = "0.3.12" }
wayland-protocols-wlr = { features = ["client"], version = "0.3.12" }
x11rb = { default-features = false, features = ["allow-unsafe-code", "xtest"], version = "=0.14.0" }
xkbcommon = { default-features = false, features = ["wayland", "x11"], version = "=0.9.0" }
zbus = { default-features = false, features = ["async-io", "blocking-api"], version = "=5.19.0" }
